pool: test-agent-pool

trigger: none

steps:
- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)\parent_module'
    backendServiceArm: 'todo-infra-v1-sc'
    backendAzureRmStorageAccountName: 'stgpipeline9120'
    backendAzureRmContainerName: 'statefile'
    backendAzureRmKey: 'terraform.tfstate'
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)\parent_module'
    environmentServiceNameAzureRM: 'todo-infra-v1-sc'